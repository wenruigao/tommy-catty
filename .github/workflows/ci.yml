name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: gofmt 检查
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "以下文件未通过 gofmt："
            echo "$out"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          # 必须钉住 v2.x：v1 最后一个版本（1.64.8）由 Go 1.24 构建，
          # 低于 go.mod 声明的 Go 1.26.0，会直接报错拒绝加载配置。
          # 也不要用 latest——它曾解析到 v1 导致 CI 长期失败。
          version: v2.15.0
          args: --timeout=3m

      - name: go test
        run: go test ./...

      - name: 交叉编译检查（linux）
        run: GOOS=linux go build ./...

      - name: 交叉编译检查（darwin）
        run: GOOS=darwin go build ./...
