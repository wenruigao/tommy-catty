# Tommy-Cat Agent 配置文件
#
# 模型接入完全声明式：在 llm.providers 下添加任意数量的供应商即可。
# 支持两种协议（protocol 字段选择）：OpenAI Chat Completions 兼容协议（默认）
# 与 Anthropic Messages API（protocol: "anthropic"），无需修改代码。
#
# API Key 支持两种写法:
#   直接写:   api_key: "sk-xxx"
#   环境变量: api_key: "${DEEPSEEK_API_KEY}"

llm:
  # 默认供应商（未指定 model 时使用）
  default_provider: "mimo"
  # 降级供应商（主供应商失败时自动切换）
  fallback_provider: "deepseek"

  # ── 重试策略 ──
  retry:
    max_retries: 3              # 最大重试次数（不含首次调用）
    base_backoff_ms: 500        # 基础退避时间（毫秒）
    max_backoff_ms: 30000       # 最大退避时间上限（毫秒）
    backoff_multiplier: 2.0     # 退避倍数（指数增长因子）
    jitter_factor: 0.2          # 抖动因子（0.0~1.0），防止惊群效应
    retry_on_unknown: true      # 未知错误是否重试
    max_total_timeout_s: 120    # 所有重试的总时间上限（秒）

  # ── 熔断器 ──
  circuit_breaker:
    failure_threshold: 5        # 连续失败多少次后触发熔断
    success_threshold: 2        # 半开状态下连续成功多少次后恢复
    open_timeout_s: 60          # 熔断后多久进入半开状态（秒）

  # ── 语义缓存（L1 精确哈希层，缓存键含工具列表；L2 向量相似层属 P2 未实现）──
  # cache:
  #   enabled: true               # 显式启用（缺省关闭）
  #   capacity: 500               # 缓存条目容量
  #   ttl: "10m"                  # 过期时间

  # ── Token 计量/预算（计量始终启用，用量经 GET /api/v1/usage 暴露）──
  # meter:
  #   daily_token_limit: 1000000  # 每日 Token 预算（<=0 不限），达 80% 时日志预警

  # 模型供应商列表 — 按需增删，无需改代码
  providers:
    mimo:
      base_url: "https://token-plan-cn.xiaomimimo.com/v1/chat/completions"
      api_key: "${MIMO_API_KEY}"
      model: "mimo-v2.5-pro"
      max_tokens: 32768
      timeout: "120s"

    deepseek:
      base_url: "https://api.deepseek.com/chat/completions"
      api_key: "${DEEPSEEK_API_KEY}"
      model: "deepseek-chat"
      max_tokens: 65536
      timeout: "120s"

    qwen:
      base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions"
      api_key: "${DASHSCOPE_API_KEY}"
      model: "qwen-max"
      max_tokens: 32768
      timeout: "90s"

    # ── 以下为可选接入示例，取消注释即可使用 ──

    # openai:
    #   base_url: "https://api.openai.com/v1/chat/completions"
    #   api_key: "${OPENAI_API_KEY}"
    #   model: "gpt-4o"
    #   max_tokens: 128000

    # ollama (本地模型):
    #   base_url: "http://localhost:11434/v1/chat/completions"
    #   api_key: "ollama"
    #   model: "qwen2.5:72b"
    #   max_tokens: 8192
    #   timeout: "300s"

    # vllm (自部署推理服务):
    #   base_url: "http://localhost:8000/v1/chat/completions"
    #   api_key: ""
    #   model: "Qwen/Qwen2.5-72B-Instruct"
    #   max_tokens: 32768

    # lm-studio (桌面端本地推理):
    #   base_url: "http://localhost:1234/v1/chat/completions"
    #   api_key: "lm-studio"
    #   model: "local-model"
    #   max_tokens: 8192

    # anthropic (Claude 系列模型，使用 Anthropic Messages API 协议):
    # anthropic:
    #   protocol: "anthropic"
    #   # base_url 可省略，默认 https://api.anthropic.com/v1/messages
    #   # base_url: "https://api.anthropic.com/v1/messages"
    #   api_key: "${ANTHROPIC_API_KEY}"
    #   model: "claude-sonnet-4-5"
    #   max_tokens: 200000
    #   timeout: "120s"

    # 自定义供应商（任何 OpenAI 兼容 API）:
    # my-custom:
    #   base_url: "https://my-api.example.com/v1/chat/completions"
    #   api_key: "${MY_CUSTOM_KEY}"
    #   model: "my-model-v1"
    #   max_tokens: 16384
    #   headers:
    #     X-Custom-Header: "value"

engine:
  max_iterations: 20
  system_prompt: ""
  # trace_export_path: "data/traces.jsonl"  # 追踪 span 的 JSONL 导出路径（默认空=禁用）

  # ── 自我反思与重规划（默认禁用）──
  # 启用后，Agent 会定期让 LLM 自评执行质量，不满意时调整或重新规划。
  reflection:
    enabled: false               # 是否启用反思（默认 false）
    interval_steps: 5            # 每隔多少步执行一次阶段性反思
    satisfaction_threshold: 0.6  # 满意度低于此分数触发调整
    max_replans: 2               # 最大重规划次数
    deviation_threshold: 1.5     # 累积偏差超过此值触发重规划

# ────────────────────────────────────────────────────────────
# HTTP 服务配置（多用户模式，cmd/server 入口）
# ────────────────────────────────────────────────────────────
# server:
#   mode: "http"
#   addr: ":8080"
#   auth_mode: "header"                  # header（内网，信任 X-User-ID）| api_key | jwt
#   auth_api_key: "${AGENT_API_KEY}"     # auth_mode=api_key 时必填，请求需携带 X-API-Key
#   auth_jwt_secret: "${AGENT_JWT_SECRET}" # auth_mode=jwt 时必填（HS256 签名密钥）
#   auth_user_id: "agent-bot"                # auth_mode=api_key 时建议配置：绑定固定身份，
#                                            # 忽略客户端 X-User-ID（防止同一密钥持有者互相冒充）

# ────────────────────────────────────────────────────────────
# 搜索引擎配置（web_search 工具）
# ────────────────────────────────────────────────────────────
search:
  default_engine: "duckduckgo"   # duckduckgo（免费）| tavily（需 API Key，效果更好）
  # tavily_api_key: "${TAVILY_API_KEY}"  # Tavily API Key（可选）
  max_results: 5                 # 默认返回结果数

# ────────────────────────────────────────────────────────
# 会话与限流
# ────────────────────────────────────────────────────────
session:
  requests_per_minute: 30        # 每用户每分钟最大请求数（per-user 滑动窗口限流；0 表示不限流）

# 安全审计日志（JSONL 追加写）：记录 L2+ 工具调用与所有命中策略的决策，
# 含操作人（user_id）、检查点、输入内容，保证审批决策可追溯；留空则禁用审计
audit_log_path: "data/audit.jsonl"

policy_file: "config/policy.yaml"
skill_store_path: "data/skills.json"
work_dir: "."

# ────────────────────────────────────────────────────────────
# Agent 人格体系（agent.md / soul.md / 用户画像）
# ────────────────────────────────────────────────────────────
# agent.md 定义 Agent 的职责与权限边界（最高优先级，用户指令不得覆盖）；
# soul.md 定义 Agent 的人格与对话风格；用户画像由系统自动生成并更新，
# 三者会在每次任务执行时组装进系统提示词。文件缺失时使用内置兜底文本。
#
# persona:
#   agent_md_path: "config/agent.md"        # Agent 职责与权限边界文件
#   soul_md_path: "config/soul.md"          # Agent 人格与对话风格文件
#   user_profiles_dir: "data/users"         # 用户画像（user.md）存放目录
#   profile_update_interval_runs: 3         # 每完成多少次任务更新一次用户画像

# ────────────────────────────────────────────────────────────
# db_query 查询结果缓存（缺省启用：容量 200 / TTL 5 分钟）
# ────────────────────────────────────────────────────────────
# db_query_cache:
#   enabled: true                 # 置 false 可禁用
#   capacity: 200                 # 缓存条目容量
#   ttl: "5m"                     # 过期时间

# ────────────────────────────────────────────────────────────
# 数据库只读查询（db_query 工具）
# ────────────────────────────────────────────────────────────
# 每个条目是一个数据源，key 为数据源名称（调用 db_query 时通过 datasource 指定）。
# 安全保证：仅放行 SELECT/SHOW/DESCRIBE/EXPLAIN/WITH；多重防御（语句白名单、
# 危险模式拦截、表/列权限、LIMIT 注入），建议数据库侧再使用只读账号。
#
# databases:
#   analytics:
#     driver: "mysql"                 # mysql | postgres | sqlite
#     dsn: "${ANALYTICS_DB_DSN}"      # 例如 user:pass@tcp(host:3306)/dbname
#     max_open_conns: 5
#     max_idle_conns: 2
#     conn_max_lifetime: "30m"
#     query_timeout: "30s"
#     max_rows: 500                   # 结果集行数硬上限
#     allow_union: false              # 是否允许 UNION
#     allow_subquery: true            # 是否允许子查询
#     allowed_tables:                 # 表名白名单（支持 * 通配符）
#       - "orders"
#       - "users"
#       - "analytics_*"
#     denied_columns:                 # 列黑名单（table.column 或 *.column）
#       - "users.password_hash"
#       - "*.secret_key"
#
#   local_sqlite:
#     driver: "sqlite"
#     dsn: "./data/app.db"
#     allowed_tables: ["*"]

# ────────────────────────────────────────────────────────────
# 本地知识库（kb_search / kb_read / kb_list 工具）
# ────────────────────────────────────────────────────────────
# 启动时扫描 paths 下的文本文件，分块后建立内存倒排索引（BM25 检索）。
#
# knowledge_bases:
#   - name: "project_docs"
#     paths:
#       - "./docs"
#       - "./README.md"
#     exclude: ["node_modules", "*.min.js"]
#     extensions: [".md", ".txt", ".go"]
#     strategy: "auto"                # auto | heading | paragraph
#     max_tokens: 500                 # 每块最大 token
#     overlap: 100                    # 滑动窗口重叠
#     max_file_mb: 5                  # 单文件大小上限
#     top_k: 5                        # 默认检索返回数

# ────────────────────────────────────────────────────────────
# MCP Server 接入（Model Context Protocol 远程工具）
# ────────────────────────────────────────────────────────────
# 启动时连接下列 MCP Server，发现其工具并注册到工具注册表。
# 单个 server 连接失败只记警告，不中断启动；servers 为空时跳过。
#
# mcp:
#   servers:
#     # stdio 传输：启动本地子进程
#     - name: "filesystem"
#       transport: "stdio"            # stdio | sse
#       command: "npx"
#       args: ["-y", "@modelcontextprotocol/server-filesystem", "/tmp"]
#       risk_level: 1                 # 工具风险等级 0~3（默认 1）
#       timeout_seconds: 30           # 请求超时（秒，默认 30）
#
#     # sse 传输：连接远程 HTTP 端点
#     - name: "remote"
#       transport: "sse"
#       url: "http://localhost:3001/sse"
#       # headers:
#       #   Authorization: "Bearer ${MCP_REMOTE_TOKEN}"
#       # tool_prefix: "remote_"      # 工具名前缀（默认 "<name>_"）

# ────────────────────────────────────────────────────────────
# Channel 接入层（通用渠道，对齐 OpenClaw 的 Channel 机制）
# ────────────────────────────────────────────────────────────
# key 为渠道名，内置渠道（声明式配置即接入）：
#   webhook   通用 HTTP 接收 + callback_url 异步投递（任何系统可直接接入）
#   dingtalk  钉钉企业内部机器人（回调加签验证 + sessionWebhook/oTo 回复）
#   feishu    飞书自建应用（url_verification 挑战 + 事件签名验证）
#   wechat    微信公众号（echostr 接入校验 + XML 消息 + 客服消息回复），配置键也可写 "微信"
#   wecom     企业微信自建应用（明文/AES 加密回调 + 应用消息回复）
#   telegram  Telegram Bot（长轮询，无需公网回调；群聊仅响应 @ 消息）
#   whatsapp  WhatsApp（Cloud API Webhook 格式 + 出站消息接口）
#   qq        QQ 官方机器人（Webhook 回调 + ed25519 签名验证 + REST 回复）
# 会话键为 "渠道名:用户/群ID"，与 HTTP X-User-ID 身份隔离，
# per-user 限流、安全门禁与审计按会话键天然生效。
# 未配置 channels 时接入层不启动，行为与旧版完全一致。
# 各渠道启用时必填凭证缺失会拒绝启动（不允许无认证端点）。
#
# channels:
#   webhook:
#     enabled: true
#     token: "${CHANNEL_WEBHOOK_TOKEN}"  # 必填，调用方经 Authorization: Bearer <token> 携带
#     # callback_url: "http://localhost:9000/callback"  # 默认投递地址（单次请求可覆盖）
#     allow_users: ["*"]                 # 空或 ["*"] = 不限制
#     group_mode: mention_only           # always | mention_only | never
#     ack_message: "收到，处理中…"        # 受理提示（空则不发）
#     request_timeout: 120s              # 单条消息执行超时
#
#   dingtalk:
#     enabled: false
#     client_id: "${DINGTALK_APP_KEY}"          # 必填，应用 appKey
#     client_secret: "${DINGTALK_APP_SECRET}"   # 必填，兼回调加签密钥
#     # path_prefix: /channels/dingtalk         # 管理端配置的回调地址路径
#
#   feishu:
#     enabled: false
#     app_id: "${FEISHU_APP_ID}"                # 必填
#     app_secret: "${FEISHU_APP_SECRET}"        # 必填
#     encrypt_key: "${FEISHU_ENCRYPT_KEY}"      # 建议配置（强制 X-Lark-Signature 校验）
#     # verification_token: "${FEISHU_VERIFICATION_TOKEN}"  # 可选二次验证
#
#   wechat:
#     enabled: false
#     app_id: "${WECHAT_APP_ID}"                # 必填，公众号 appid
#     app_secret: "${WECHAT_APP_SECRET}"        # 必填，公众号 appsecret
#     token: "${WECHAT_TOKEN}"                  # 必填，公众平台回调 Token
#     # 注意：公众平台仅支持明文消息模式（加密模式回调将被跳过）
#
#   wecom:
#     enabled: false
#     corp_id: "ww1234567890abcdef"             # 必填，企业 ID
#     agent_id: "1000002"                       # 必填，自建应用 agentid
#     agent_secret: "${WECOM_AGENT_SECRET}"     # 必填，自建应用 secret
#     token: "${WECOM_TOKEN}"                   # 必填，回调 Token
#     encoding_aes_key: "${WECOM_AES_KEY}"      # 可选（43 位，配置后支持加密回调）
#
#   telegram:
#     enabled: false
#     token: "${TELEGRAM_BOT_TOKEN}"            # 必填，BotFather 颁发的 Token
#     # api_base: "https://api.telegram.org"    # 可指向代理
#
#   whatsapp:
#     enabled: false
#     token: "${WHATSAPP_WEBHOOK_TOKEN}"        # 必填，入站回调验证令牌
#     phone_number_id: "123456789"              # 出站必填，Cloud API phone_number_id
#     # api_token: "${WHATSAPP_API_TOKEN}"      # 出站令牌（缺省复用 token）
#     # api_base: "https://graph.facebook.com/v19.0"  # 可指向 Twilio 等中转网关
#
#   qq:
#     enabled: false
#     app_id: "${QQ_APP_ID}"                    # 必填，开放平台 AppID
#     app_secret: "${QQ_APP_SECRET}"            # 必填，兼派生 ed25519 签名密钥
#     # 管理端回调地址填 /channels/qq，勾选 C2C/群 @ 消息事件

