#     max_idle_conns: 2
#     conn_max_lifetime: "30m"
#     query_timeout: "30s"
#     max_rows: 500                   # 结果集行数硬上限
#     allow_union: false              # 是否允许 UNION
#     allow_subquery: true            # 是否允许子查询
#     allowed_tables:                 # 表名白名单（支持 * 通配符）
